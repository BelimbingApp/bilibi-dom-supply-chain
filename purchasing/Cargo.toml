# Purchasing (`supply_chain/purchasing`), a Domain module of the Supply Chain
# container. Discovered by the Platform when the container is mounted at
# apps/domains/supply_chain; never built alone.
[package]
name = "bilibi-supply-chain-purchasing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
bilibi-authz.workspace = true
bilibi-company.workspace = true
bilibi-database.workspace = true
bilibi-menu.workspace = true
bilibi-module-registry.workspace = true
bilibi-tenancy.workspace = true
inventory.workspace = true
rust_decimal.workspace = true
serde_json.workspace = true
tokio-postgres.workspace = true

[dev-dependencies]
# Cargo makes a member of every path dependency of a member, dev-dependencies
# included, so this edge is what lets the mounted gates format, lint and build
# the walkthrough. It is never a `[dependencies]` entry: the product does not
# link the fixture.
bilibi-supply-chain-walkthrough = { path = "../fixtures/walkthrough" }
