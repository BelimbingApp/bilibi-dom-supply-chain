{# Bilimbi datetime, resolved by Base Datetime and followed by the shared shell hook. #}
<time id="{{ id }}" datetime="{{ value.iso }}" data-format="datetime" data-precision="second" data-mode="{{ value.mode.as_str() }}" data-text-company="{{ value.company }}" data-text-utc="{{ value.utc }}" data-follow-shell="true" data-hook="DateTime" class="tabular-nums whitespace-nowrap text-xs text-ink-muted">{{ value.text }}</time>
