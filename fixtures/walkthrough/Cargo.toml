# The Supply Chain walkthrough: example-only, run against a disposable database.
# Discovery never sees `fixtures/`; the purchasing crate lists this crate as a
# dev-dependency so the mounted gates lint and build it as a workspace member.
[package]
name = "bilibi-supply-chain-walkthrough"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
bilibi-authz.workspace = true
bilibi-base.workspace = true
bilibi-core.workspace = true
bilibi-database.workspace = true
bilibi-domains.workspace = true
bilibi-extensions.workspace = true
bilibi-module-registry.workspace = true
bilibi-ports.workspace = true
bilibi-supply-chain-purchasing = { path = "../../purchasing" }
bilibi-tenancy.workspace = true
rust_decimal.workspace = true
serde_json.workspace = true
bilibi-walkthrough-fixture = { path = "../../../../../fixtures/walkthrough" }
tokio.workspace = true
tokio-postgres.workspace = true
